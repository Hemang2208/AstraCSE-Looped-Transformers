# AstraCSE Loop-Transformer variant — Architecture.md §31.
# 3 unique layers, looped 4x -> effective depth 12 (same as baseline model.yaml),
# same per-token training FLOPs as the baseline, ~34% of the parameters.
# Most aggressive point on the efficiency frontier; highest eval-accuracy risk.

model:
  vocab_size: 15000
  d_model: 768
  n_layer: 12
  n_unique_layers: 3
  n_head: 12
  d_head: 64          # must equal d_model / n_head
  d_ff: 2048
  max_seq_len: 1024
  rope: true
  norm: rmsnorm
  norm_eps: 1.0e-5
  activation: swiglu
  bias: false          # no bias on any linear or norm layer
  weight_tying: true
  expected_param_count: 32768256

precision:
  compute_dtype: bf16
  optimizer_dtype: fp32

tokenizer:
  algorithm: byte_level_bpe
  vocab_size: 15000
  special_tokens: ["<bos>", "<eos>", "<pad>", "<doc>"]

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip_norm: 1.0

lr_schedule:
  peak_lr: 6.0e-4
  min_lr_ratio: 0.1
  warmup_ratio: 0.02
  schedule: cosine

training:
  target_effective_batch_tokens: 500000
