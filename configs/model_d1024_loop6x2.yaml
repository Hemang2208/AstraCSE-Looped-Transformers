# Loop transformer at the larger width: configs/model_d1024.yaml with 6 unique blocks
# looped 2x (depth 12). Same per-token training FLOPs as the 164.8M dense model, about
# 55% of its parameters (90.1M). Tests whether the loop-vs-dense gap seen at d_model
# 768 changes with width and with the ~3.8x larger corpus v2.
# Checked by: python scripts/verify_param_count.py configs/model_d1024_loop6x2.yaml

model:
  vocab_size: 15000
  d_model: 1024
  n_layer: 12
  n_unique_layers: 6
  n_head: 16
  d_head: 64          # must equal d_model / n_head
  d_ff: 2688
  max_seq_len: 1024
  rope: true
  norm: rmsnorm
  norm_eps: 1.0e-5
  activation: swiglu
  bias: false          # no bias on any linear or norm layer
  weight_tying: true
  expected_param_count: 90096640

precision:
  compute_dtype: bf16
  optimizer_dtype: fp32

tokenizer:
  algorithm: byte_level_bpe
  vocab_size: 15000
  special_tokens: ["<bos>", "<eos>", "<pad>", "<doc>"]

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip_norm: 1.0

lr_schedule:
  peak_lr: 5.0e-4
  min_lr_ratio: 0.1
  warmup_ratio: 0.02
  schedule: cosine

training:
  target_effective_batch_tokens: 500000
