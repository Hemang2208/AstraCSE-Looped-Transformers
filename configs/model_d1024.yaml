# AstraCSE-165M: the parameter-scaling point, trained on corpus v2 (shards_v2).
# Same architecture family as configs/model.yaml (12 layers, RoPE, RMSNorm, SwiGLU,
# tied embeddings), wider: d_model 1024, 16 heads of 64, d_ff 2688 (2.625x, the
# multiple of 128 closest to the SwiGLU 8/3 ratio).
# peak_lr 5e-4: between GPT-3's 6e-4 (125M) and 3e-4 (350M); no sweep was run.
# Checked by: python scripts/verify_param_count.py configs/model_d1024.yaml

model:
  vocab_size: 15000
  d_model: 1024
  n_layer: 12
  n_head: 16
  d_head: 64          # must equal d_model / n_head
  d_ff: 2688
  max_seq_len: 1024
  rope: true
  norm: rmsnorm
  norm_eps: 1.0e-5
  activation: swiglu
  bias: false          # no bias on any linear or norm layer
  weight_tying: true
  expected_param_count: 164807680

precision:
  compute_dtype: bf16
  optimizer_dtype: fp32

tokenizer:
  algorithm: byte_level_bpe
  vocab_size: 15000
  special_tokens: ["<bos>", "<eos>", "<pad>", "<doc>"]

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip_norm: 1.0

lr_schedule:
  peak_lr: 5.0e-4
  min_lr_ratio: 0.1
  warmup_ratio: 0.02
  schedule: cosine

training:
  target_effective_batch_tokens: 500000
